# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: "CI"

on:
  pull_request:
    branches:
      - "trunk"
  push:
    branches:
      - "trunk"

env:
  PHP_EXTENSIONS: "mbstring"

jobs:
  coding-standards:
    name: "Coding Standards"

    runs-on: "ubuntu-24.04"

    strategy:
      matrix:
        php-version:
          - "7.4"

        dependencies:
          - "locked"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "${{ env.PHP_EXTENSIONS }}"
          coverage: "none"
          tools: "composer:v2"

      - name: "Validate composer.json and composer.lock"
        run: "composer validate --strict"

      - name: "Determine composer cache directory"
        shell: "bash"
        run: "echo \"COMPOSER_CACHE_DIR=$(composer config cache-dir)\" >> $GITHUB_ENV"

      - name: "Cache PHAR files installed with phive"
        uses: "actions/cache@v5"
        with:
          path: "${{ runner.temp }}/.phive"
          key: "php-${{ matrix.php-version }}-phive-${{ matrix.dependencies }}-${{ hashFiles('.phive/phars.xml') }}"
          restore-keys: "php-${{ matrix.php-version }}-phive-${{ matrix.dependencies }}-"

      - name: "Install PHIVE"
        uses: "szepeviktor/phive@54bea80b5ac4e1b91f6df7aa071fcd5b2a8ee605" # v1.0.1
        with:
          home: "${{ runner.temp }}/.phive"

      - name: "Install PHP tools with PHIVE"
        uses: "szepeviktor/phive-install@df144276db4732517dd8ea8d5dc45797b2f77ff1" # v1
        with:
          home: "${{ runner.temp }}/.phive"
          trustGpgKeys: "C00543248C87FB13,31C7E470E2138192,A978220305CD5C32"

      - name: "Cache dependencies installed with composer"
        uses: "actions/cache@v5"
        with:
          path: "${{ env.COMPOSER_CACHE_DIR }}"
          key: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-"

      - name: "Install lowest dependencies from composer.json"
        if: "matrix.dependencies == 'lowest'"
        run: "composer update --no-interaction --no-progress --prefer-lowest"

      - name: "Install locked dependencies from composer.lock"
        if: "matrix.dependencies == 'locked'"
        run: "composer install --no-interaction --no-progress"

      - name: "Install highest dependencies from composer.json"
        if: "matrix.dependencies == 'highest'"
        run: "composer update --no-interaction --no-progress"

      # setup-php writes GITHUB_TOKEN into the global auth.json as github-oauth.
      # The Composer bundled in composer-normalize 2.45.0 still validates that
      # token against {^[.A-Za-z0-9_]+$}, which rejects the hyphen GITHUB_TOKEN
      # sometimes contains, so this job failed at random. Current Composer
      # dropped the check, which is why no other step in this job is affected.
      # Point this one step at an empty COMPOSER_HOME so it never reads the
      # token; it only ever touches the local composer.json and composer.lock.
      - name: "Run ergebnis/composer-normalize"
        env:
          COMPOSER_HOME: "${{ runner.temp }}/composer-normalize-home"
        run: "tools/composer-normalize normalize --dry-run"

      - name: "Run wp-coding-standards/wpcs"
        run: |
          test -f tools/composer.json || echo '{}' > tools/composer.json
          composer config --working-dir=tools allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --working-dir=tools "wp-coding-standards/wpcs:^3.1.0" "phpcsstandards/phpcsutils:^1.0" "phpcsstandards/phpcsextra:^1.0"
          tools/vendor/bin/phpcs --config-set installed_paths tools/vendor/wp-coding-standards/wpcs,tools/vendor/phpcsstandards/phpcsutils,tools/vendor/phpcsstandards/phpcsextra
          tools/vendor/bin/phpcs -s --standard=WordPress-Core --exclude=WordPress.Files.FileName --ignore=*/sqlite-database-integration/* src/

  static-code-analysis:
    name: "Static Code Analysis"

    runs-on: "ubuntu-24.04"

    strategy:
      matrix:
        php-version:
          - "7.4"

        dependencies:
          - "locked"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "${{ env.PHP_EXTENSIONS }}"
          coverage: "none"
          tools: "composer:v2"

      - name: "Determine composer cache directory"
        shell: "bash"
        run: "echo \"COMPOSER_CACHE_DIR=$(composer config cache-dir)\" >> $GITHUB_ENV"

      - name: "Cache PHAR files installed with phive"
        uses: "actions/cache@v5"
        with:
          path: "${{ runner.temp }}/.phive"
          key: "php-${{ matrix.php-version }}-phive-${{ matrix.dependencies }}-${{ hashFiles('.phive/phars.xml') }}"
          restore-keys: "php-${{ matrix.php-version }}-phive-${{ matrix.dependencies }}-"

      - name: "Install PHIVE"
        uses: "szepeviktor/phive@54bea80b5ac4e1b91f6df7aa071fcd5b2a8ee605" # v1.0.1
        with:
          home: "${{ runner.temp }}/.phive"

      - name: "Install PHP tools with PHIVE"
        uses: "szepeviktor/phive-install@df144276db4732517dd8ea8d5dc45797b2f77ff1" # v1
        with:
          home: "${{ runner.temp }}/.phive"
          trustGpgKeys: "C00543248C87FB13,31C7E470E2138192,A978220305CD5C32"

      - name: "Cache dependencies installed with composer"
        uses: "actions/cache@v5"
        with:
          path: "${{ env.COMPOSER_CACHE_DIR }}"
          key: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-"

      - name: "Install lowest dependencies from composer.json"
        if: "matrix.dependencies == 'lowest'"
        run: "composer update --no-interaction --no-progress --prefer-lowest"

      - name: "Install locked dependencies from composer.lock"
        if: "matrix.dependencies == 'locked'"
        run: "composer install --no-interaction --no-progress"

      - name: "Install highest dependencies from composer.json"
        if: "matrix.dependencies == 'highest'"
        run: "composer update --no-interaction --no-progress"

      - name: "Create cache directory for phpstan/phpstan"
        run: "mkdir -p .build/phpstan"

      - name: "Cache cache directory for phpstan/phpstan"
        uses: "actions/cache@v5"
        with:
          path: ".build/phpstan"
          key: "php-${{ matrix.php-version }}-phpstan-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-phpstan-"

      - name: "Run phpstan/phpstan"
        run: |
          composer require --working-dir=tools "szepeviktor/phpstan-wordpress:^1.1"
          tools/vendor/bin/phpstan analyze src/

  tests:
    name: "Tests"

    runs-on: "ubuntu-24.04"

    strategy:
      matrix:
        php-version:
          - "8.4"
          - "8.3"
          - "8.2"
          - "8.1"
          - "8.0"
          - "7.4"
          - "7.3"
          - "7.2"

        dependencies:
          - "lowest"
          - "locked"
          - "highest"

        exclude:
          # Locked/highest dependencies require PHP 7.3+.
          - php-version: "7.2"
            dependencies: "locked"
          - php-version: "7.2"
            dependencies: "highest"
          # Lowest PHPUnit 9.5.x predates PHP 8.4 and is incompatible.
          - php-version: "8.4"
            dependencies: "lowest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "${{ env.PHP_EXTENSIONS }}"
          coverage: "none"
          tools: "composer:v2"

      - name: "Determine composer cache directory"
        shell: "bash"
        run: "echo \"COMPOSER_CACHE_DIR=$(composer config cache-dir)\" >> $GITHUB_ENV"

      - name: "Cache dependencies installed with composer"
        uses: "actions/cache@v5"
        with:
          path: "${{ env.COMPOSER_CACHE_DIR }}"
          key: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-"

      - name: "Remove platform PHP override"
        run: "composer config --unset platform.php"

      - name: "Pin PHPUnit 7.5 for PHP 7.2 and ignore its security advisory"
        if: "matrix.php-version == '7.2'"
        run: |
          composer config audit.ignore '["PKSA-z3gr-8qht-p93v"]' --json
          composer require --no-update --no-interaction --dev 'phpunit/phpunit:^7.5'

      - name: "Install lowest dependencies from composer.json"
        if: "matrix.dependencies == 'lowest'"
        run: "composer update --no-interaction --no-progress --prefer-lowest"

      - name: "Install locked dependencies from composer.lock"
        if: "matrix.dependencies == 'locked'"
        run: "composer install --no-interaction --no-progress"

      - name: "Install highest dependencies from composer.json"
        if: "matrix.dependencies == 'highest'"
        run: "composer update --no-interaction --no-progress"

      - name: "Run integration tests with phpunit/phpunit"
        run: |
          cp -f src/dbless-wpdb.php wordpress/wp-content/db.php
          composer run-script phpunit

  wordpress-version-tests:
    name: "Tests (WP ${{ matrix.wordpress-version }})"

    runs-on: "ubuntu-24.04"

    strategy:
      matrix:
        php-version:
          - "8.4"

        # The "highest" strategy above always follows the newest release the
        # constraint allows, so it stops covering a major as soon as the next
        # one ships. Pin the majors that must keep working here.
        wordpress-version:
          - "6.6.*"
          - "7.0.*"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "${{ env.PHP_EXTENSIONS }}"
          coverage: "none"
          tools: "composer:v2"

      - name: "Determine composer cache directory"
        shell: "bash"
        run: "echo \"COMPOSER_CACHE_DIR=$(composer config cache-dir)\" >> $GITHUB_ENV"

      - name: "Cache dependencies installed with composer"
        uses: "actions/cache@v5"
        with:
          path: "${{ env.COMPOSER_CACHE_DIR }}"
          key: "php-${{ matrix.php-version }}-composer-wp-${{ matrix.wordpress-version }}-${{ hashFiles('composer.json') }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-wp-${{ matrix.wordpress-version }}-"

      - name: "Install dependencies with WordPress ${{ matrix.wordpress-version }}"
        env:
          WORDPRESS_VERSION: "${{ matrix.wordpress-version }}"
        run: |
          composer config --unset platform.php
          composer require --no-update --no-interaction "roots/wordpress:${WORDPRESS_VERSION}"
          composer update --no-interaction --no-progress

      - name: "Verify the expected WordPress version is installed"
        env:
          WORDPRESS_VERSION: "${{ matrix.wordpress-version }}"
        run: |
          php -r '
            require "wordpress/wp-includes/version.php";
            $expected = rtrim(getenv("WORDPRESS_VERSION"), ".*");
            if (strpos($wp_version, $expected) !== 0) {
              fwrite(STDERR, "Expected WordPress {$expected}.x, got {$wp_version}\n");
              exit(1);
            }
            echo "WordPress {$wp_version}\n";
          '

      - name: "Run integration tests with phpunit/phpunit"
        run: |
          cp -f src/dbless-wpdb.php wordpress/wp-content/db.php
          composer run-script phpunit

  wp-trunk-tests:
    name: "Tests (WP trunk)"

    runs-on: "ubuntu-24.04"
    continue-on-error: true

    strategy:
      matrix:
        php-version:
          - "8.4"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "${{ env.PHP_EXTENSIONS }}"
          coverage: "none"
          tools: "composer:v2"

      - name: "Determine composer cache directory"
        shell: "bash"
        run: "echo \"COMPOSER_CACHE_DIR=$(composer config cache-dir)\" >> $GITHUB_ENV"

      - name: "Cache dependencies installed with composer"
        uses: "actions/cache@v5"
        with:
          path: "${{ env.COMPOSER_CACHE_DIR }}"
          key: "php-${{ matrix.php-version }}-composer-wp-trunk-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-wp-trunk-"

      - name: "Install dependencies with WP trunk"
        run: |
          composer config --unset platform.php
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require --no-update "roots/wordpress:dev-main"
          composer update --no-interaction --no-progress

      - name: "Run integration tests with phpunit/phpunit"
        run: |
          cp -f src/dbless-wpdb.php wordpress/wp-content/db.php
          composer run-script phpunit
